<!DOCTYPE html>
<html lang="en">
<head>

            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            color: green;
        }
        .contact-card:hover {
            background: #e07e1f;
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.22);
        }

    </style>

<body>
